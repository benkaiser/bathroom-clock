<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
      .preview-controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.85);
        padding: 15px 30px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 20px;
        font-family: sans-serif;
      }
      .preview-controls label {
        color: white !important;
        font-size: 16px;
        white-space: nowrap;
        min-width: 180px;
      }
      .preview-controls input[type="range"] {
        flex: 1;
        height: 8px;
        cursor: pointer;
      }
      .preview-controls .time-label {
        color: #ffd700;
        font-size: 18px;
        font-weight: bold;
        min-width: 80px;
        text-align: center;
      }
      .preview-controls .period-label {
        color: #aaa;
        font-size: 14px;
        min-width: 100px;
      }
      .preview-controls button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        background: #444;
        color: white;
      }
      .preview-controls button:hover {
        background: #666;
      }
      .preview-controls button.active {
        background: #ffd700;
        color: black;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="preview-controls">
      <label>Time of Day:</label>
      <input type="range" id="timeSlider" min="0" max="1440" value="720" step="1">
      <span class="time-label" id="timeLabel">12:00 PM</span>
      <span class="period-label" id="periodLabel">Midday</span>
      <button id="playBtn">&#9654; Play</button>
    </div>
    <script src="/bundle.js"></script>
    <script>
      const slider = document.getElementById('timeSlider');
      const timeLabel = document.getElementById('timeLabel');
      const periodLabel = document.getElementById('periodLabel');
      const playBtn = document.getElementById('playBtn');

      function getPeriodName(hour) {
        if (hour >= 20 || hour < 5.5) return 'Night';
        if (hour < 6) return 'Late Night';
        if (hour < 8) return 'Dawn';
        if (hour < 11) return 'Morning';
        if (hour < 14) return 'Midday';
        if (hour < 17) return 'Afternoon';
        if (hour < 20) return 'Evening';
        return 'Night';
      }

      function formatTime(minutes) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        const period = h >= 12 ? 'PM' : 'AM';
        const displayH = h === 0 ? 12 : h > 12 ? h - 12 : h;
        return displayH + ':' + String(m).padStart(2, '0') + ' ' + period;
      }

      function updateTheme() {
        const minutes = parseInt(slider.value);
        const hour = minutes / 60;
        timeLabel.textContent = formatTime(minutes);
        periodLabel.textContent = getPeriodName(hour);
        window.previewThemeAtHour(hour);
      }

      slider.addEventListener('input', updateTheme);

      // Set slider to current time initially, then immediately apply preview
      const now = new Date();
      slider.value = now.getHours() * 60 + now.getMinutes();
      // Use setTimeout to run after bundle.js startThemeUpdater() has finished
      setTimeout(updateTheme, 0);

      // Play mode: animate through the day
      let playing = false;
      let playInterval = null;
      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.classList.toggle('active', playing);
        playBtn.innerHTML = playing ? '&#9646;&#9646; Pause' : '&#9654; Play';
        if (playing) {
          playInterval = setInterval(() => {
            slider.value = (parseInt(slider.value) + 1) % 1441;
            updateTheme();
          }, 50);
        } else {
          clearInterval(playInterval);
        }
      });
    </script>
  </body>
</html>
